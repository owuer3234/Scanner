<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingredient Scanner</title>
<meta name="description" content="Scan a product barcode and check its ingredients against a tiered safety database. Works offline.">
<meta name="theme-color" content="#0d0f12">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scanner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  color-scheme: dark;
  --bg: #0d0f12;
  --surface: #15191e;
  --surface-2: #1d2228;
  --border: #2a3139;
  --text: #e9edf1;
  --muted: #9aa4ae;
  --accent: #4dabf7;
  --accent-ink: #06121d;
  --on-tier: #0d0f12;
  --t1: #ff6b6b; --t1-bg: rgba(255, 107, 107, .14);
  --t2: #ffa94d; --t2-bg: rgba(255, 169, 77, .14);
  --t3: #ffd43b; --t3-bg: rgba(255, 212, 59, .12);
  --t4: #51cf66; --t4-bg: rgba(81, 207, 102, .12);
  --tn: #9aa4ae; --tn-bg: rgba(154, 164, 174, .14);
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --border: #dce0e5;
    --text: #14181d;
    --muted: #5c6670;
    --accent: #1971c2;
    --accent-ink: #ffffff;
    --on-tier: #ffffff;
    --t1: #d32f2f; --t1-bg: rgba(211, 47, 47, .09);
    --t2: #d9480f; --t2-bg: rgba(217, 72, 15, .10);
    --t3: #a07800; --t3-bg: rgba(230, 180, 0, .15);
    --t4: #2b8a3e; --t4-bg: rgba(43, 138, 62, .10);
    --tn: #5c6670; --tn-bg: rgba(92, 102, 112, .10);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  font: 16px/1.45 var(--font);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
a { color: var(--accent); }
svg { flex: none; }

.t1 { --tc: var(--t1); --tbg: var(--t1-bg); }
.t2 { --tc: var(--t2); --tbg: var(--t2-bg); }
.t3 { --tc: var(--t3); --tbg: var(--t3-bg); }
.t4 { --tc: var(--t4); --tbg: var(--t4-bg); }
.tnone { --tc: var(--tn); --tbg: var(--tn-bg); }

/* ------------------------------------------------ scanner (always dark) */
#scanner { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: #000; color: #fff; overflow: hidden; }
#video { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s; }
.cam-on #video { opacity: 1; }
.viewfinder { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; padding-bottom: 40px; }
body.cam-fallback .viewfinder { display: none; }
.reticle {
  position: relative;
  width: min(82vw, 380px);
  height: min(50vw, 230px);
  border-radius: 18px;
  box-shadow: 0 0 0 200vmax rgba(0, 0, 0, .5);
}
.reticle i { position: absolute; width: 36px; height: 36px; border: 0 solid #fff; transition: border-color .15s; }
.reticle .tl { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 18px; }
.reticle .tr { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 18px; }
.reticle .bl { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 18px; }
.reticle .br { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 18px; }
.laser {
  position: absolute; left: 7%; right: 7%; top: 50%; height: 2px; border-radius: 2px;
  background: #ff5252; box-shadow: 0 0 10px 1px rgba(255, 82, 82, .8);
  animation: sweep 2.4s ease-in-out infinite;
}
body:not(.cam-on) .laser { display: none; }
.reticle.hit i { border-color: #51cf66; }
.reticle.hit .laser { background: #51cf66; box-shadow: 0 0 14px 2px rgba(81, 207, 102, .9); animation: none; }
@keyframes sweep { 0%, 100% { top: 14%; } 50% { top: 86%; } }
@media (prefers-reduced-motion: reduce) { .laser { animation: none; } }
.hint { margin-top: 22px; font-size: 14px; background: rgba(0, 0, 0, .55); padding: 7px 14px; border-radius: 999px; max-width: 86vw; text-align: center; }

.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; align-items: center; gap: 4px;
  padding: calc(env(safe-area-inset-top) + 8px) 8px 18px 16px;
  background: linear-gradient(rgba(0, 0, 0, .7), rgba(0, 0, 0, 0));
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 17px; margin-right: auto; letter-spacing: -.01em; }
.icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; color: #fff; }
.icon-btn:active { background: rgba(255, 255, 255, .15); }
.icon-btn.plain { color: var(--muted); }
.icon-btn.plain:active { background: var(--surface-2); }

.bottombar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  display: flex; justify-content: center; gap: 10px;
  padding: 28px 16px calc(env(safe-area-inset-bottom) + 18px);
  background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, .7));
}
.fab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  min-width: 96px; padding: 11px 12px; border-radius: 16px; font-size: 12.5px; font-weight: 550;
  color: #fff; background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .16);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.fab:active { background: rgba(255, 255, 255, .24); }
.fab.on { background: #fff; color: #000; }

.cam-fallback { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; padding: 90px 16px 120px; background: #0d0f12; }
.fb-card { width: 100%; max-width: 420px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.fb-card svg { color: #9aa4ae; }
.fb-card h2 { font-size: 20px; }
.fb-card p { color: #b3bcc5; font-size: 14.5px; }
.fb-form { display: flex; gap: 8px; width: 100%; margin-top: 6px; }
.fb-form input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid #2a3139; background: #15191e; color: #e9edf1; font-size: 17px; letter-spacing: .04em; }
.fb-actions { display: flex; gap: 8px; width: 100%; }
.fb-actions .btn { flex: 1; }
#scanner .btn.ghost { color: #e9edf1; border-color: #2a3139; background: #15191e; }

/* ------------------------------------------------ buttons & forms */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 12px;
  font-weight: 600; font-size: 16px; background: var(--accent); color: var(--accent-ink);
  border: 1px solid transparent; text-decoration: none;
}
.btn:active { filter: brightness(.9); }
.btn.ghost { background: var(--surface-2); color: var(--text); border-color: var(--border); }
.btn.block { width: 100%; }
.form { display: flex; flex-direction: column; gap: 14px; }
.form label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
.form input, .form select, .form textarea {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface-2); font-size: 16px; font-weight: 400; color: var(--text);
}
.form textarea { resize: vertical; min-height: 140px; line-height: 1.4; }
.form input:focus, .form select:focus, .form textarea:focus, .searchbox:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ------------------------------------------------ bottom sheet */
.backdrop { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10; background: rgba(0, 0, 0, .4); opacity: 0; pointer-events: none; transition: opacity .25s; }
.backdrop.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  margin: 0 auto; max-width: 680px;
  max-height: calc(100vh - 48px);
  max-height: calc(100dvh - env(safe-area-inset-top) - 24px);
  display: flex; flex-direction: column;
  background: var(--surface); color: var(--text);
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .45);
  transform: translateY(105%);
  transition: transform .34s cubic-bezier(.2, .85, .25, 1);
  visibility: hidden;
}
.sheet.open { transform: none; visibility: visible; }
.sheet:not(.open) { transition: transform .26s ease-in, visibility 0s .26s; }
.sheet.full { height: calc(100vh - 48px); height: calc(100dvh - env(safe-area-inset-top) - 24px); }
.sheet-grab { flex: none; padding: 8px 8px 4px 20px; touch-action: none; }
.handle { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto 4px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { font-size: 18px; font-weight: 650; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 8px 16px 24px; }
.sheet-footer { flex: none; display: flex; gap: 10px; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); border-top: 1px solid var(--border); background: var(--surface); }
.sheet-footer .btn { flex: 1; }

/* ------------------------------------------------ result content */
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.center { text-align: center; }
.mono { font-family: var(--mono); }
.label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }

.product { display: flex; gap: 14px; align-items: center; margin: 4px 0 16px; }
.thumb {
  position: relative; flex: none; width: 72px; height: 72px; border-radius: 14px; overflow: hidden;
  background: var(--surface-2); color: var(--muted); display: flex; align-items: center; justify-content: center;
}
.thumb img { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: cover; background: #fff; }
.thumb.sm { width: 48px; height: 48px; border-radius: 10px; }
.thumb.sm svg { width: 22px; height: 22px; }
.product-text { min-width: 0; }
.product h2 { font-size: 19px; line-height: 1.25; font-weight: 650; overflow-wrap: anywhere; }
.product .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

.verdict { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--radius); background: var(--tbg); border: 1px solid var(--tc); }
.verdict-badge { flex: none; padding: 9px 14px; border-radius: 10px; background: var(--tc); color: var(--on-tier); font-weight: 800; font-size: 17px; letter-spacing: .06em; }
.verdict-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.verdict-text strong { font-size: 15.5px; line-height: 1.3; }
.verdict-text span { font-size: 13.5px; color: var(--muted); }

.tierbar { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; margin: 14px 0 8px; background: var(--surface-2); }
.tierbar span { background: var(--tc); min-width: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i, .tier-section h3 i, .browse summary i, .watch li > i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--tc); flex: none; }

section { margin-top: 24px; }
section h3 { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 650; margin-bottom: 8px; }
.count { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

.watch { padding: 14px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); }
.watch h3 svg { color: var(--t2); }
.watch ul { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.watch li { display: flex; gap: 10px; align-items: flex-start; }
.watch li > i { margin-top: 6px; }
.watch li strong { display: block; font-size: 14.5px; overflow-wrap: anywhere; }
.watch li span { display: block; font-size: 13.5px; color: var(--muted); }

.flag, .info {
  padding: 12px 14px; border-radius: 12px; margin-bottom: 10px;
  background: var(--tbg); border-left: 4px solid var(--tc);
}
.flag header, .info header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.flag h4, .info h4 { font-size: 15.5px; line-height: 1.3; overflow-wrap: anywhere; }
.flag-label { font-size: 12.5px; color: var(--muted); margin: 3px 0 6px; }
.why { font-size: 14.5px; }
.effects { margin: 8px 0 0 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); }
.effects li { margin: 2px 0; }
.effects li::marker { color: var(--tc); }

.pill {
  flex: none; display: inline-flex; align-items: center; white-space: nowrap;
  font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  color: var(--tc); background: var(--surface); border: 1px solid var(--tc);
}

.review p:last-child { font-size: 14px; }

.chips { line-height: 1; }
.chip {
  display: inline-block; margin: 0 6px 7px 0; padding: 7px 10px; border-radius: 9px;
  font-size: 14px; line-height: 1.25; text-align: left;
  background: var(--tbg); border: 1px solid transparent; border-left: 4px solid var(--tc);
  color: var(--text);
}
.chip.unlisted { border-style: dashed; border-color: var(--tc); border-left-style: solid; }
.chip.sel { outline: 2px solid var(--tc); outline-offset: 1px; }
.chip-group { display: inline; }
.chip-group::before { content: "("; color: var(--muted); margin-right: 4px; }
.chip-group::after { content: ")"; color: var(--muted); margin-right: 8px; }
#chipInfo:not(:empty) { margin-top: 8px; }

.disclaimer { margin-top: 22px; font-size: 12.5px; color: var(--muted); }

.notice { display: flex; gap: 12px; padding: 14px; border-radius: var(--radius); background: var(--t2-bg); margin-bottom: 18px; }
.notice-icon { color: var(--t2); padding-top: 2px; }
.notice h3 { font-size: 16px; margin-bottom: 3px; }
.notice p { font-size: 14.5px; }
.qr-text { white-space: pre-wrap; word-break: break-all; font: 13px/1.4 var(--mono); padding: 12px; border-radius: 10px; background: var(--surface-2); }

.loading { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 0 18px; text-align: center; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.empty { text-align: center; padding: 28px 0; }
.history { list-style: none; }
.history li + li { border-top: 1px solid var(--border); }
.history button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 0; text-align: left; }
.history svg:last-child { color: var(--muted); }
.h-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.h-text strong { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-verdict { flex: none; font-size: 11px; font-weight: 800; letter-spacing: .05em; padding: 4px 8px; border-radius: 7px; background: var(--tc); color: var(--on-tier); }

.searchbox { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); margin-bottom: 14px; }
.searchbox input { flex: 1; min-width: 0; border: 0; background: none; padding: 13px 0; font-size: 16px; color: var(--text); outline: none; }
.results { list-style: none; }
.results li + li { border-top: 1px solid var(--border); }
.results button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; text-align: left; }
.results button > span:first-child { display: flex; flex-direction: column; min-width: 0; }
.results strong { font-size: 15px; }
#searchOut > .btn { margin-bottom: 12px; }
.browse { margin-bottom: 8px; border-radius: 12px; background: var(--surface-2); }
.browse summary { display: flex; align-items: center; gap: 8px; padding: 13px 14px; font-weight: 600; cursor: pointer; list-style: none; }
.browse summary::-webkit-details-marker { display: none; }
.browse .chips { padding: 0 12px 6px; }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 110px); z-index: 30;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: #23292f; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .35); transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main id="scanner" aria-label="Barcode scanner">
  <video id="video" playsinline muted autoplay aria-hidden="true"></video>

  <div class="viewfinder" aria-hidden="true">
    <div class="reticle" id="reticle"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><span class="laser"></span></div>
    <p class="hint" id="scanHint">Loading scanner…</p>
  </div>

  <div class="cam-fallback" id="camFallback" hidden>
    <div class="fb-card">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l20 20"/><path d="M9 4h6l2 3h3a2 2 0 012 2v9m-3 3H4a2 2 0 01-2-2V9a2 2 0 012-2h3"/><path d="M9.5 9.5a3.5 3.5 0 004.95 4.95"/></svg>
      <h2 id="fbTitle">Camera unavailable</h2>
      <p id="fbText"></p>
      <form class="fb-form" data-form="barcode">
        <input name="code" type="text" inputmode="numeric" pattern="[0-9 ]*" autocomplete="off" maxlength="18" placeholder="Type barcode digits" aria-label="Barcode number" required>
        <button class="btn" type="submit">Look up</button>
      </form>
      <div class="fb-actions">
        <button class="btn ghost" data-action="paste">Paste ingredients</button>
        <button class="btn ghost" data-action="retry-camera">Try again</button>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="brand"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg><span>Ingredient Scanner</span></div>
    <button class="icon-btn" id="installBtn" data-action="install" hidden aria-label="Install app"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></button>
    <button class="icon-btn" data-action="search" aria-label="Look up an ingredient"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <button class="icon-btn" data-action="history" aria-label="Recent scans"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 103-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
  </header>

  <footer class="bottombar">

    const hay = ' ' + k + ' ';

    for (let i = 0; i < phrases.length; i++) {
      const p = phrases[i];
      if (p.k.length > k.length) continue;
      if (hay.indexOf(' ' + p.k + ' ') === -1) continue;
      if (!applies(p.entry, ctx)) continue;
      if (!p.entry.safe) return p.entry;
      if (!safeHit) safeHit = p.entry;
    }
    return safeHit;
  }

  /* ---------- heuristics for unknown names ---------- */
  const NATURAL_WORDS = /\b(extract|extracts|oil|oils|butter|juice|juices|flour|powder|leaf|leaves|seed|seeds|fruit|fruits|root|roots|flower|flowers|bark|peel|rind|stem|milk|water|puree|concentrate|cream|cheese|meal|starch|protein|fiber|fibre|honey|vinegar|sugar|syrup|salt|spice|spices|herb|herbs|wax|gum|resin|kernel|nut|nuts|bean|beans|rice|corn|wheat|oat|oats|barley|rye|egg|eggs|yeast|cocoa|cacao|coffee|tea|vanilla|pepper|garlic|onion|tomato|tomatoes|potato|potatoes|apple|apples|lemon|lime|orange|berry|berries|grape|grapes|coconut|almond|almonds|soy|soya|pea|peas|lentil|lentils|chickpea|chickpeas|meat|beef|pork|chicken|turkey|fish|salmon|tuna|shrimp|culture|cultures|enzyme|enzymes|vegetable|vegetables|plant|herbal|mushroom|mushrooms|algae|seaweed|kelp|clay|mud|aloe|whey|casein|lecithin|cheddar|mozzarella|parmesan|chocolate|cinnamon|ginger|mint|basil|oregano|thyme|parsley|rosemary|sage|carrot|carrots|spinach|kale|broccoli|celery|cabbage|beet|beets|banana|mango|pineapple|peach|pear|cherry|cherries|strawberry|strawberries|raspberry|raspberries|blueberry|blueberries|cranberry|cranberries|date|dates|fig|figs|raisin|raisins|walnut|walnuts|pecan|pecans|cashew|cashews|hazelnut|hazelnuts|pistachio|pistachios|peanut|peanuts|sesame|sunflower|pumpkin|olive|olives|avocado|flower|petal|petals|blossom|needle|needles|wood|cone|husk|bran|germ|sprout|sprouts|malt|noodles|pasta|bread|crumbs|breadcrumbs|chips|filling|sauce|broth|stock|seasoning|dough|crust|batter|jam|jelly|paste|flakes|grains|grain)\b/;
  const CHEM_HINT = /(methyl|ethyl|propyl|butyl|pentyl|hexyl|heptyl|octyl|nonyl|decyl|lauryl|myristyl|cetyl|stearyl|oleyl|benzyl|phenyl|chlor|brom|fluor|iod|hydroxy|amino|nitro|sulfo|sulfon|phosph|cyclo|poly|siloxan|silan|amine|amide|imide|azol|azin|hydantoin|carboxy|glycol|glyceryl|isothiazol|dimer|ester|ether|anhydride|benz|naphth|tri|tetra|penta|hexa|isostear|diol|triol)/g;
  const CHEM_END = /(yl|ate|ite|ide|ium|ane|ene|yne|one|ol|al|ine|oate)$/;

  function looksChemical(k) {
    if (!k) return false;
    const letters = k.replace(/[^a-z]/g, '');
    if (letters.length < 4) return false;
    const hasDigits = /\d/.test(k);
    const natural = NATURAL_WORDS.test(k);
    if (natural && !hasDigits) return false;
    let hits = (k.match(CHEM_HINT) || []).length;
    k.split(' ').forEach(function (w) { if (w.length > 4 && CHEM_END.test(w)) hits++; });
    if (hasDigits && letters.length >= 4 && hits >= 1) return true;
    if (hasDigits && /\b[a-z]{2,} \d|\d [a-z]{4,}/.test(k) && !natural) return true;
    if (hits >= 3) return true;
    if (hits >= 2 && k.length >= 10) return true;
    return false;
  }

  /* ---------- classify one ingredient (given its name variants) ---------- */
  function mkDb(entry, ctx) {
    return {
      status: entry.safe ? 'safe' : 'db', tier: tierOf(entry, ctx), id: 'db:' + entry.id,
      name: entry.name, label: entry.label, why: entry.why, effects: entry.effects,
      ethoxylated: entry.ethoxylated, benzeneRisk: entry.benzeneRisk, entry: entry
    };
  }
  function mkRule(rule) {
    return {
      status: 'class', tier: rule.tier, id: 'class:' + rule.id, name: rule.label, label: rule.label,
      why: rule.why, effects: rule.effects, ethoxylated: !!rule.ethoxylated, rule: rule
    };
  }

  function classify(names, ctx) {
    const keys = [];
    names.forEach(function (n) { const k = key(n); if (k && keys.indexOf(k) === -1) keys.push(k); });
    if (!keys.length) return null;

    // 1. Exact match on the full name wins outright.
    const full = lookupExact(keys[0], ctx);
    let result = full ? mkDb(full, ctx) : null;

    // 2. Exact / phrase matches on every variant: worst flagged tier wins.
    if (!result) {
      let best = null, safeHit = null;
      keys.forEach(function (k) {
        const m = lookupExact(k, ctx) || lookupPhrase(k, ctx);
        if (!m) return;
        if (m.safe) { if (!safeHit) safeHit = m; return; }
        if (!best || tierOf(m, ctx) < tierOf(best, ctx)) best = m;
      });
      // 3. Chemical-class rules — also override a partial DB match when they are more severe
      //    (e.g. 'Perfluorononyl Dimethicone' is PFAS, not just a silicone).
      let rule = null;
      keys.forEach(function (k) {
        CLASS_RULES.forEach(function (r) { if ((!rule || r.tier < rule.tier) && r.test(k)) rule = r; });
      });
      if (best && (!rule || tierOf(best, ctx) <= rule.tier)) result = mkDb(best, ctx);
      else if (rule) result = mkRule(rule);
      else if (safeHit) result = mkDb(safeHit, ctx);
    }

    // 4. Unknown names.
    if (!result) {
      if (keys.some(looksChemical)) {
        result = {
          status: 'unknown-chemical', tier: 3, id: 'unknown:' + keys[0], name: 'Unrecognized chemical name', label: 'Unrecognized chemical name',
          why: 'Not in the database, and its name looks like a synthetic chemical — review it before trusting this product.',
          effects: ['Unknown — not yet reviewed']
        };
      } else {
        result = {
          status: 'unlisted', tier: 4, id: 'unlisted:' + keys[0], name: 'Not in database', label: 'Not in database',
          why: 'Not in the database; the name does not suggest a harmful chemical class, so it is assumed clean — review if unsure.',
          effects: []
        };
      }
    }

    // Ethoxylation (drives the inferred 1,4-dioxane warning).
    if (!result.ethoxylated && result.status !== 'safe') {
      result.ethoxylated = keys.some(function (k) {
        return hasEthSuffix(k) || /\bpeg\b|polyethylene glycol|polyoxyethylene|oxynol|\bpolyoxyl\b/.test(k);
      });
    }
    return result;
  }

  /* ---------- parsing an ingredient list ---------- */
  function splitTop(t) {
    const out = [];
    let depth = 0, buf = '';
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (c === '(' || c === '[' || c === '{') depth++;
      else if (c === ')' || c === ']' || c === '}') depth = Math.max(0, depth - 1);
      if (depth === 0) {
        const prev = t[i - 1] || '', next = t[i + 1] || '';
        let sep = false;
        if (c === ',' ) sep = !(/\d/.test(prev) && /\d/.test(next));
        else if (c === ';' || c === '•' || c === '·' || c === '|' || c === '•') sep = true;
        else if (c === '.') {
          const word = (buf.match(/([a-z]+)$/i) || ['', ''])[1];
          sep = (next === '' || (/\s/.test(next) && /^\s*[A-Z(]/.test(t.slice(i + 1)))) && word.length > 3 && !/\d/.test(prev);
        }
        if (sep) { out.push(buf); buf = ''; continue; }
      }
      buf += c;
    }
    out.push(buf);
    return out.map(function (s) { return s.trim(); }).filter(Boolean);
  }

  // Food-label function words: 'emulsifier: soy lecithin' -> 'soy lecithin'.
  const FUNCTION_PREFIX = /^(?:emulsifiers?|stabili[sz]ers?|thickeners?|thickening agents?|gelling agents?|preservatives?|acidity regulators?|acidulants?|antioxidants?|raising agents?|leavening agents?|leavening|colou?rs?|colou?rings?|sweeteners?|flavou?r enhancers?|humectants?|anti-?caking agents?|firming agents?|glazing agents?|flour treatment agents?|emulsifying salts?|acids?|vitamins?|minerals?)\s*:\s*(?=\S)/i;

  function tidy(s) {
    return s.replace(/\s+/g, ' ')
      .replace(/^(?:and\/or|and|&|or|with)\s+/i, '')
      .replace(FUNCTION_PREFIX, '')
      .replace(/^[\s:.\-–—*]+|[\s:.\-–—*]+$/g, '')
      .trim();
  }

  function slashParts(s) {
    if (s.indexOf('/') === -1) return [];
    const parts = s.split('/').map(function (p) { return p.trim(); });
    if (parts.length < 2 || !parts.every(function (p) { return /[a-z]{2,}/i.test(p); })) return [];
    return parts;
  }

  function parseSegment(seg) {
    seg = tidy(seg);
    if (!seg || !/[a-z]/i.test(seg)) return null;
    let outer = '', depth = 0, cur = '';
    const groups = [];
    for (let i = 0; i < seg.length; i++) {
      const c = seg[i];
      if (c === '(' || c === '[' || c === '{') { if (depth === 0) { cur = ''; } else cur += c; depth++; continue; }
      if (c === ')' || c === ']' || c === '}') { depth = Math.max(0, depth - 1); if (depth === 0) { groups.push(cur); } else cur += c; continue; }
      if (depth === 0) outer += c; else cur += c;
    }
    if (depth > 0 && cur) groups.push(cur);
    outer = tidy(outer);
    const children = [], synonyms = [];
    groups.forEach(function (g) {
      const parts = splitTop(g);
      if (parts.length > 1) parts.forEach(function (p) { const n = parseSegment(p); if (n) children.push(n); });
      else if (tidy(g)) synonyms.push(tidy(g));
    });
    const primary = outer || synonyms.shift() || '';
    if (!primary) return children.length === 1 ? children[0] : null;
    const names = [children.length ? primary : seg];
    if (children.length === 0 && primary !== seg) names.push(primary);
    slashParts(primary).forEach(function (p) { names.push(p); });
    synonyms.forEach(function (s) { names.push(s); slashParts(s).forEach(function (p) { names.push(p); }); });
    return { display: children.length ? primary : seg, names: names, children: children };
  }

  function preprocess(text) {
    return String(text || '')
      .replace(/\r?\n+/g, ', ')
      .replace(/_/g, '')
      .replace(/\b(?:other\s+|in)?active\s+ingredients?\s*[:\-–]?/gi, ', ')
      .replace(/\bingr[eé]dients?\s*[:\-–]/gi, ', ')
      .replace(/\binci\s*:/gi, ', ')
      .replace(/\bcontains?\s+(?:\d+(?:\.\d+)?\s*%\s+or\s+less\s+of|less\s+than\s+\d+(?:\.\d+)?\s*%\s+of)(?:\s+the\s+following)?\s*:?/gi, ', ')
      .replace(/\b(?:\d+(?:\.\d+)?\s*%\s+or\s+less\s+of|less\s+than\s+\d+(?:\.\d+)?\s*%\s+of)\s*:?/gi, ', ')
      .replace(/\bmay\s+contain\s*(?:\(\s*\+\s*\/\s*-\s*\)|\[\s*\+\s*\/\s*-\s*\]|\+\s*\/\s*-)?\s*:?/gi, ', ')
      .replace(/[\[(]\s*\+\s*\/\s*-\s*[\])]\s*:?/g, ', ')
      .replace(/\+\s*\/\s*-\s*:?/g, ', ')
      .replace(/±/g, ', ')
      .replace(/\b(?:contains|allergens?)\s*:/gi, ', ')
      .replace(/\d+(?:[.,]\d+)?\s*%/g, '')
      .replace(/\(\s*\)|\[\s*\]/g, '');
  }

  function parseIngredientText(text) {
    return splitTop(preprocess(text)).map(parseSegment).filter(Boolean);
  }

  /* ---------- analyze a whole product ---------- */
  function analyzeProduct(text, opts) {
    const ctx = (opts && opts.context) || null;
    const tree = parseIngredientText(text);
    const nodes = [];
    (function walk(list, depth) {
      list.forEach(function (n) {
        n.depth = depth;
        n.result = classify(n.names, ctx);
        nodes.push(n);
        if (n.children.length) walk(n.children, depth + 1);
      });
    })(tree, 0);

    const flaggedMap = new Map();
    const seen = new Set();
    const counts = { total: 0, clean: 0, flagged: 0, byTier: { 1: 0, 2: 0, 3: 0, 4: 0 }, unlisted: 0 };
    const review = [];
    const ethoxylatedFound = [];
    let benzoate = null, vitaminC = false;

    nodes.forEach(function (n) {
      const r = n.result;
      if (!r) return;
      const k = key(n.display);
      // A compound ingredient label ("Chocolate (sugar, cocoa…)") that is itself unknown isn't counted.
      const isWrapper = n.children.length && (r.status === 'unlisted' || r.status === 'safe');
      if (!isWrapper && !seen.has(k)) {
        seen.add(k);
        counts.total++;
        counts.byTier[r.tier]++;
        if (r.tier === 4) counts.clean++; else counts.flagged++;
        if (r.status === 'unlisted') { counts.unlisted++; review.push(n.display); }
      }
      if (r.tier < 4) {
        let f = flaggedMap.get(r.id);
        if (!f) { f = Object.assign({}, r, { found: [] }); flaggedMap.set(r.id, f); }
        if (f.found.indexOf(n.display) === -1) f.found.push(n.display);
      }
      if (r.ethoxylated && ethoxylatedFound.indexOf(n.display) === -1) ethoxylatedFound.push(n.display);
      if (r.benzeneRisk) benzoate = benzoate || n.display;
      if (n.names.some(function (nm) { return /\b(ascorbic acid|vitamin c|e30[0-2]|sodium ascorbate|calcium ascorbate)\b/.test(key(nm)); })) vitaminC = true;
    });

    const inferred = [];
    if (ethoxylatedFound.length) {
      inferred.push({
        status: 'inferred', tier: 1, id: 'inferred:dioxane', name: '1,4-Dioxane (likely contaminant)', label: 'Inferred manufacturing contaminant',
        why: 'Not on the label, but ethoxylated ingredients (PEGs and "-eth" names) are routinely contaminated with 1,4-dioxane, a likely human carcinogen.',
        effects: GROUPS.dioxane.effects,
        found: ['Inferred from: ' + ethoxylatedFound.join(', ')]
      });
    }
    if (benzoate && vitaminC) {
      inferred.push({
        status: 'inferred', tier: 3, id: 'inferred:benzene', name: 'Benzene formation risk', label: 'Ingredient combination',
        why: 'A benzoate preservative combined with vitamin C can form benzene (a known carcinogen), especially with heat or light.',
        effects: ['Benzene formation (known human carcinogen)'],
        found: ['Combination: ' + benzoate + ' + vitamin C']
      });
    }

    const flagged = Array.from(flaggedMap.values()).concat(inferred)
      .sort(function (a, b) { return a.tier - b.tier || a.found[0].localeCompare(b.found[0]); });
    const byTier = { 1: [], 2: [], 3: [] };
    flagged.forEach(function (f) { byTier[f.tier].push(f); });
    const watch = flagged.filter(function (f) { return f.status === 'class' || f.status === 'unknown-chemical' || f.status === 'inferred'; });

    let worst = 4;
    nodes.forEach(function (n) { if (n.result && n.result.tier < worst) worst = n.result.tier; });
    inferred.forEach(function (f) { if (f.tier < worst) worst = f.tier; });
    const verdict = !nodes.length ? 'UNKNOWN' : worst === 1 ? 'AVOID' : worst <= 3 ? 'CAUTION' : 'CLEAN';

    return { tree: tree, nodes: nodes, flagged: flagged, byTier: byTier, watch: watch, inferred: inferred, review: review, counts: counts, worst: worst, verdict: verdict, context: ctx };
  }

  /* ---------- single-ingredient lookup & search ---------- */
  function analyzeName(name, ctx) {
    const seg = parseSegment(String(name || ''));
    if (!seg) return null;
    return classify(seg.names, ctx || null);
  }

  function search(q, limit) {
    const k = key(q);
    if (!k) return [];
    const scored = [];
    entries.forEach(function (e) {
      let best = 0;
      e.names.forEach(function (n) {
        const nk = key(n);
        if (nk === k) best = Math.max(best, 3);
        else if (nk.indexOf(k) === 0) best = Math.max(best, 2);
        else if (nk.indexOf(k) > -1) best = Math.max(best, 1);
      });
      if (best) scored.push({ e: e, s: best });
    });
    scored.sort(function (a, b) { return b.s - a.s || a.e.tier - b.e.tier || a.e.name.localeCompare(b.e.name); });
    return scored.slice(0, limit || 25).map(function (x) { return x.e; });
  }

  function entriesByTier() {
    const out = { 1: [], 2: [], 3: [] };
    entries.forEach(function (e) { out[e.tier].push(e); });
    Object.keys(out).forEach(function (t) { out[t].sort(function (a, b) { return a.name.localeCompare(b.name); }); });
    return out;
  }

  if (warnings.length && typeof console !== 'undefined') console.warn('[ingredient-db]', warnings);

  return {
    TIERS: TIERS, key: key, parseIngredientText: parseIngredientText, analyzeProduct: analyzeProduct,
    analyzeName: analyzeName, search: search, entriesByTier: entriesByTier, looksChemical: looksChemical,
    warnings: warnings, stats: { entries: entries.length, names: exact.size, rules: CLASS_RULES.length }
  };
})();
</script>
<script id="app">
/* ==========================================================================
   APP — camera, product lookup, UI

(function () {
  'use strict';

  // ZXing is loaded from cdnjs; the local copy is only a fallback if the CDN is unreachable.
  // Keep this list in sync with ZXING_URLS in sw.js.
  const ZXING_SOURCES = [
    'https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.21.3/zxing.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.21.3/umd/index.min.js',
    'zxing.min.js'

  const HISTORY_KEY = 'scanner.history.v1';
  const HISTORY_MAX = 10;
  const LOOKUP_TIMEOUT_MS = 12000;
  const API_FIELDS = 'code,product_name,product_name_en,generic_name,brands,image_front_small_url,image_front_url,image_small_url,image_url,ingredients_text,ingredients_text_en,ingredients,lang';

  const $ = function (s, r) { return (r || document).querySelector(s); };
  const esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

  const plural = function (n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); };

  const els = {

    sheet: $('#sheet'), sheetTitle: $('#sheetTitle'), sheetBody: $('#sheetBody'), sheetFooter: $('#sheetFooter'),

  /* ---------------------------------------------------------------- icons */
  const ICON = {

    alert: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
    search: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
    chevron: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
  };

  /* ---------------------------------------------------------------- toast */

  /* ---------------------------------------------------------------- ZXing loader */

  const zxingReady = ZXING_SOURCES.reduce(function (p, src) {
    return p.catch(function () { return loadScript(src); });
  }, Promise.reject()).then(function (lib) {
    Z = lib;
    Scanner.initReader();
    if (Scanner.stream) setHint('Align the barcode inside the frame');

  }).catch(function (err) {

    console.error(err);
    setHint('Scanner failed to load — enter the barcode manually');
  });

  /* ---------------------------------------------------------------- camera scanner */

  const Scanner = {

      clearTimeout(this.timer);
      if (this.stream) this.stream.getTracks().forEach(function (t) { t.stop(); });
      this.stream = null; this.track = null; this.torchOn = false;
      els.video.srcObject = null;
      els.torch.hidden = true;
      els.torch.classList.remove('on');
      document.body.classList.remove('cam-on');
    },

    setupTrack: function () {
      const t = this.track;
      const caps = t && t.getCapabilities ? t.getCapabilities() : {};
      els.torch.hidden = !caps.torch;
      if (caps.focusMode && caps.focusMode.indexOf('continuous') > -1) {
        t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
      }
    },

    toggleTorch: function () {
      if (!this.track) return;
      const on = !this.torchOn;
      this.track.applyConstraints({ advanced: [{ torch: on }] }).then(function () {
        Scanner.torchOn = on;
        els.torch.classList.toggle('on', on);
      }).catch(function () { toast('Flashlight not available'); });
    },

    loop: function () {
      const self = this;
      clearTimeout(this.timer);
      (function tick() {
        if (!self.stream) return;
        if (!self.paused && self.reader && els.video.readyState >= 2) self.decodeFrame();
        self.timer = setTimeout(tick, 140);
      })();
    },

    // Decode only the part of the frame under the reticle — faster and more accurate.
    decodeFrame: function () {
      const v = els.video, vw = v.videoWidth, vh = v.videoHeight;
      if (!vw || !vh) return;
      const vr = v.getBoundingClientRect(), rr = els.reticle.getBoundingClientRect();
      const s = Math.max(vr.width / vw, vr.height / vh);              // object-fit: cover scale
      const dx = (vr.width - vw * s) / 2, dy = (vr.height - vh * s) / 2;
      let sx = (rr.left - vr.left - dx) / s, sy = (rr.top - vr.top - dy) / s;
      let sw = rr.width / s, sh = rr.height / s;
      sx -= sw * 0.12; sw *= 1.24; sy -= sh * 0.3; sh *= 1.6;           // generous margin
      sx = Math.max(0, sx); sy = Math.max(0, sy);
      sw = Math.min(vw - sx, sw); sh = Math.min(vh - sy, sh);
      if (sw < 20 || sh < 20) return;
      const scale = Math.min(1, 960 / sw);
      const c = this.canvas;
      c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
      if (!this.ctx) this.ctx = c.getContext('2d', { willReadFrequently: true });
      this.ctx.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
      try {
        const bitmap = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)));
        const res = this.reader.decodeWithState(bitmap);
        this.onResult(res.getText(), Z.BarcodeFormat[res.getBarcodeFormat()]);
      } catch (e) {
        /* NotFound / Checksum / Format exceptions are normal between frames */
      }
    },

    onResult: function (text, format) {
      // Ignore a code that has stayed in view since it was last handled; it can be
      // scanned again once it has been out of view for a moment.
      const now = Date.now();
      const repeat = text === this.lastText && now - this.lastAt < 1500;
      this.lastText = text; this.lastAt = now;
      if (repeat) return;
      this.paused = true;
      if (navigator.vibrate) navigator.vibrate(60);
      els.reticle.classList.add('hit');
      setTimeout(function () { els.reticle.classList.remove('hit'); }, 700);
      handleScan(text, format);
    }
  };

  const FALLBACK_COPY = {
    denied: ['Camera access is blocked', 'Allow camera access for this site in your browser settings (iPhone: Settings › Safari › Camera; Android: tap the icon left of the address bar), then tap Try again.'],
    insecure: ['Camera needs a secure connection', 'Open this app over https:// (or localhost) to use the camera.'],
    unsupported: ['Camera not supported', 'This browser cannot access the camera. Try Safari on iPhone or Chrome on Android.'],
    notfound: ['No camera found', 'This device does not seem to have a usable camera.'],
    busy: ['Camera is busy', 'Another app or tab may be using the camera. Close it and tap Try again.'],
    generic: ['Camera unavailable', 'The camera could not be started.']
  };
  function showFallback(kind) {
    const c = FALLBACK_COPY[kind] || FALLBACK_COPY.generic;
    els.fbTitle.textContent = c[0];
    els.fbText.textContent = c[1] + ' You can still type a barcode or paste an ingredient list.';
    els.fallback.hidden = false;
    document.body.classList.add('cam-fallback');
  }
  function hideFallback() {
    els.fallback.hidden = true;
    document.body.classList.remove('cam-fallback');
  }

  /* ---------------------------------------------------------------- barcode helpers */
  function upcEtoA(e) {
    const ns = e[0], d = e.slice(1, 7), check = e[7];
    let m;
    switch (d[5]) {
      case '0': case '1': case '2': m = d.slice(0, 2) + d[5] + '0000' + d.slice(2, 5); break;
      case '3': m = d.slice(0, 3) + '00000' + d.slice(3, 5); break;
      case '4': m = d.slice(0, 4) + '00000' + d[4]; break;
      default: m = d.slice(0, 5) + '0000' + d[5];
    }
    return ns + m + check;
  }
  function gtinValid(code) {
    if (!/^\d{8,14}$/.test(code)) return false;
    const digits = code.split('').map(Number), check = digits.pop();
    let sum = 0;
    digits.reverse().forEach(function (d, i) { sum += d * (i % 2 === 0 ? 3 : 1); });
    return (10 - (sum % 10)) % 10 === check;
  }
  function barcodeCandidates(code, format) {
    const list = [];
    const add = function (c) { if (c && list.indexOf(c) === -1) list.push(c); };
    if (format === 'UPC_E' && code.length === 8) code = upcEtoA(code);
    if (code.length === 12) add('0' + code);
    add(code);
    if (code.length === 8 && /^[01]/.test(code) && format !== 'EAN_8') {
      const a = upcEtoA(code);
      if (gtinValid(a)) add('0' + a);
    }
    if (code.length === 13 && code[0] === '0') add(code.slice(1));
    return list;
  }

  function handleScan(raw, format) {
    const text = String(raw || '').trim();
    let code = text.replace(/\s+/g, '');
    if (format === 'QR_CODE' || !/^\d+$/.test(code)) {
      const gs1 = text.match(/\/01\/(\d{8,14})(?:[/?#]|$)/);
      if (gs1) code = gs1[1];
      else if (!/^\d{8,14}$/.test(code)) return renderQrInfo(text);
    }
    lookupBarcode(code, format);
  }

  /* ---------------------------------------------------------------- product lookup */
  async function fetchJSON(url) {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(function () { if (ctl) ctl.abort(); }, LOOKUP_TIMEOUT_MS);
    try {
      const res = await fetch(url, { signal: ctl ? ctl.signal : undefined, headers: { Accept: 'application/json' } });
      if (res.status === 404) return { status: 0 };
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  const SOURCES = [
    { name: 'Open Food Facts', context: 'food', host: 'https://world.openfoodfacts.org' },
    { name: 'Open Beauty Facts', context: 'beauty', host: 'https://world.openbeautyfacts.org' }
  ];

  function extractIngredients(p) {
    const lang = p.lang;
    const t = p.ingredients_text_en || (lang && p['ingredients_text_' + lang]) || p.ingredients_text || '';
    if (t && t.trim()) return t.replace(/_/g, '').trim();
    if (Array.isArray(p.ingredients) && p.ingredients.length) {
      const fmt = function (i) {
        return (i.text || '').replace(/_/g, '') + (Array.isArray(i.ingredients) && i.ingredients.length ? ' (' + i.ingredients.map(fmt).join(', ') + ')' : '');
      };
      return p.ingredients.map(fmt).filter(Boolean).join(', ');
    }
    return '';
  }

  async function fetchBoth(code) {
    const results = await Promise.all(SOURCES.map(function (src) {
      return fetchJSON(src.host + '/api/v2/product/' + encodeURIComponent(code) + '.json?fields=' + API_FIELDS)
        .then(function (j) { return { ok: true, src: src, product: j && j.status === 1 && j.product ? j.product : null }; })
        .catch(function (e) { console.warn(src.name, e); return { ok: false, src: src, product: null }; });
    }));
    const found = results.filter(function (r) { return r.product; });
    const withIng = found.filter(function (r) { return extractIngredients(r.product); });
    return { ok: results.some(function (r) { return r.ok; }), hit: withIng[0] || found[0] || null };
  }

  function toRecord(code, hit) {
    const p = hit.product;
    return {
      code: p.code || code,
      name: (p.product_name_en || p.product_name || p.generic_name || '').trim() || 'Unnamed product',
      brand: (p.brands || '').split(',')[0].trim(),
      image: p.image_front_small_url || p.image_small_url || p.image_front_url || p.image_url || '',
      source: hit.src.name,
      context: hit.src.context,
      url: hit.src.host + '/product/' + encodeURIComponent(p.code || code),
      ingredientsText: extractIngredients(p),
      scannedAt: Date.now()
    };
  }

  let lookupToken = 0;
  async function lookupBarcode(code, format) {
    const token = ++lookupToken;
    renderLoading(code);
    const candidates = barcodeCandidates(code, format);
    let anyOk = false, hit = null, usedCode = candidates[0];
    for (let i = 0; i < candidates.length && !hit; i++) {
      const r = await fetchBoth(candidates[i]);
      if (token !== lookupToken) return;
      anyOk = anyOk || r.ok;
      if (r.hit) { hit = r.hit; usedCode = candidates[i]; }
      if (!r.ok) break;
    }
    if (token !== lookupToken || !state.sheetOpen) return;
    if (hit) {
      const rec = toRecord(usedCode, hit);
      if (rec.ingredientsText) { saveHistory(rec); renderResult(rec); }
      else renderPaste({ reason: 'noIngredients', record: rec });
    } else {
      renderPaste({ reason: anyOk ? 'notFound' : 'offline', record: { code: code, name: '', context: null } });
    }
  }

  /* ---------------------------------------------------------------- history */
  function loadHistory() {
    try { const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); return Array.isArray(h) ? h : []; }
    catch (e) { return []; }
  }
  function saveHistory(rec) {
    try {
      const sameAs = function (h) { return rec.code ? h.code === rec.code : (!h.code && h.name === rec.name && h.ingredientsText === rec.ingredientsText); };
      const list = loadHistory().filter(function (h) { return !sameAs(h); });
      list.unshift(rec);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, HISTORY_MAX)));
    } catch (e) { /* storage full or blocked — history is a convenience */ }
  }
  function clearHistory() {
    try { localStorage.removeItem(HISTORY_KEY); } catch (e) { /* ignore */ }
  }

  /* ---------------------------------------------------------------- sheet */
  const state = { sheetOpen: false, view: null, record: null, report: null };

  function openSheet(opts) {
    state.view = opts.view;
    els.sheetTitle.textContent = opts.title || '';
    els.sheetBody.innerHTML = opts.body || '';
    els.sheetFooter.innerHTML = opts.footer || '';
    els.sheetFooter.hidden = !opts.footer;
    els.sheet.classList.toggle('full', !!opts.full);
    els.sheetBody.scrollTop = 0;
    Scanner.paused = true;
    if (!state.sheetOpen) {
      state.sheetOpen = true;
      els.sheet.setAttribute('aria-hidden', 'false');
      els.backdrop.classList.add('show');
      requestAnimationFrame(function () { els.sheet.classList.add('open'); });
      try { history.pushState({ sheet: true }, ''); } catch (e) { /* ignore */ }
    }
  }
  function hideSheet() {
    if (!state.sheetOpen) return;
    state.sheetOpen = false;
    state.view = null;
    lookupToken++;
    els.sheet.classList.remove('open');
    els.sheet.style.transform = '';
    els.sheet.setAttribute('aria-hidden', 'true');
    els.backdrop.classList.remove('show');
    if (document.activeElement && els.sheet.contains(document.activeElement)) document.activeElement.blur();
    Scanner.lastAt = Date.now();
    Scanner.paused = false;
    if (!Scanner.stream && !Scanner.blocked && !document.hidden) Scanner.start();
  }
  function closeSheet() {
    if (!state.sheetOpen) return;
    if (history.state && history.state.sheet) history.back(); // popstate -> hideSheet
    else hideSheet();
  }
  window.addEventListener('popstate', function () { if (state.sheetOpen) hideSheet(); });

  // Drag the handle/header down to dismiss.
  (function () {
    const grab = $('#sheetGrab');
    let y0 = 0, dy = 0, dragging = false;
    grab.addEventListener('touchstart', function (e) { dragging = true; y0 = e.touches[0].clientY; dy = 0; els.sheet.style.transition = 'none'; }, { passive: true });
    grab.addEventListener('touchmove', function (e) {
      if (!dragging) return;
      dy = Math.max(0, e.touches[0].clientY - y0);
      els.sheet.style.transform = 'translateY(' + dy + 'px)';
    }, { passive: true });
    grab.addEventListener('touchend', function () {
      if (!dragging) return;
      dragging = false;
      els.sheet.style.transition = '';
      els.sheet.style.transform = '';
      if (dy > 110) closeSheet();
    });
  })();

  /* ---------------------------------------------------------------- views */
  function tierClass(t) { return 't' + t; }
  function pill(t) { return '<span class="pill ' + tierClass(t) + '">Tier ' + t + ' · ' + Engine.TIERS[t].short + '</span>'; }
  const CONTEXT_LABEL = { food: 'Food', beauty: 'Personal care' };

  function renderLoading(code) {
    openSheet({
      view: 'loading', title: 'Looking up product',
      body: '<div class="loading"><div class="spinner" aria-hidden="true"></div><p>Searching Open Food Facts and Open Beauty Facts…</p><p class="mono muted">' + esc(code) + '</p></div>',
      footer: '<button class="btn ghost" data-action="close">Cancel</button>'
    });
  }

  function renderQrInfo(text) {
    openSheet({
      view: 'qr', title: 'QR code scanned',
      body: '<div class="notice"><div class="notice-icon">' + ICON.alert + '</div><div><h3>Not a product barcode</h3><p>This QR code does not contain a product number we can look up.</p></div></div>' +
        '<p class="label">QR content</p><pre class="qr-text">' + esc(text) + '</pre>',
      footer: '<button class="btn" data-action="close">Scan again</button>'
    });
  }

  function verdictCopy(report) {
    const c = report.counts, w = report.worst;
    if (report.verdict === 'AVOID') {
      const contaminant = report.inferred.some(function (f) { return f.tier === 1; });
      if (!c.byTier[1]) return 'Likely contaminated with 1,4-dioxane';
      return 'Contains ' + plural(c.byTier[1], 'confirmed-harmful ingredient') + (contaminant ? ' + a likely contaminant' : '');
    }
    if (w === 2) return 'Contains ' + plural(c.byTier[2], 'ingredient') + ' of strong concern';
    if (w === 3) return 'Only precautionary flags found';
    if (report.verdict === 'UNKNOWN') return 'No ingredients could be read';
    return 'No flagged ingredients found';
  }

  function flagCard(f) {
    const inferred = f.status === 'inferred';
    const matched = f.status === 'db' && Engine.key(f.name) !== Engine.key(f.found[0]) ? 'Matched: ' + esc(f.name) + ' · ' : '';
    return '<article class="flag ' + tierClass(f.tier) + '">' +
      '<header><h4>' + esc(inferred ? f.name : f.found.join(', ')) + '</h4>' + pill(f.tier) + '</header>' +
      '<p class="flag-label">' + (inferred ? esc(f.found[0]) : matched + esc(f.label) + (f.status === 'class' ? ' · <em>class-based</em>' : '')) + '</p>' +
      '<p class="why">' + esc(f.why) + '</p>' +
      (f.effects && f.effects.length ? '<ul class="effects">' + f.effects.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '') +
      '</article>';
  }

  function chipsHtml(report) {
    const idx = new Map();
    report.nodes.forEach(function (n, i) { idx.set(n, i); });
    function chips(list) {
      return list.map(function (n) {
        const r = n.result;
        const cls = 'chip ' + tierClass(r.tier) + (r.status === 'unlisted' ? ' unlisted' : '');
        let h = '<button class="' + cls + '" data-action="chip" data-i="' + idx.get(n) + '">' + esc(n.display) + '</button>';
        if (n.children.length) h += '<span class="chip-group">' + chips(n.children) + '</span>';
        return h;
      }).join('');
    }
    return chips(report.tree);
  }

  function infoCardHtml(title, r) {
    if (!r) return '';
    const status = { db: 'In database', safe: 'Known clean ingredient', class: 'Flagged by chemical class', 'unknown-chemical': 'Unrecognized — chemical-sounding name', unlisted: 'Not in database' }[r.status] || '';
    return '<div class="info ' + tierClass(r.tier) + '"><header><h4>' + esc(title) + '</h4>' + pill(r.tier) + '</header>' +
      '<p class="flag-label">' + esc(status) + (r.status === 'db' && Engine.key(r.name) !== Engine.key(title) ? ' · matched ' + esc(r.name) : '') + (r.label && r.status !== 'safe' && r.status !== 'unlisted' ? ' · ' + esc(r.label) : '') + '</p>' +
      '<p class="why">' + esc(r.why) + '</p>' +
      (r.effects && r.effects.length ? '<ul class="effects">' + r.effects.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '') +
      '</div>';
  }

  function renderResult(rec) {
    const report = Engine.analyzeProduct(rec.ingredientsText, { context: rec.context });
    state.record = rec; state.report = report;
    const c = report.counts, vt = report.verdict === 'UNKNOWN' ? 0 : report.worst;
    const total = Math.max(1, c.total);

    let h = '<div class="product">' +
      '<div class="thumb">' + (rec.image ? '<img src="' + esc(rec.image) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' : '') + ICON.box + '</div>' +
      '<div class="product-text"><h2>' + esc(rec.name || 'Unnamed product') + '</h2>' +
      (rec.brand ? '<p class="muted">' + esc(rec.brand) + '</p>' : '') +
      '<p class="meta">' + [rec.source, CONTEXT_LABEL[rec.context], rec.code].filter(Boolean).map(esc).join(' · ') + '</p></div></div>';

    h += '<div class="verdict ' + (vt ? tierClass(vt) : 'tnone') + '"><div class="verdict-badge">' + report.verdict + '</div>' +
      '<div class="verdict-text"><strong>' + esc(verdictCopy(report)) + '</strong>' +
      '<span>' + c.clean + ' clean · ' + c.flagged + ' flagged · ' + c.total + ' total</span></div></div>';

    h += '<div class="tierbar" aria-hidden="true">' + [1, 2, 3, 4].map(function (t) {
      return c.byTier[t] ? '<span class="' + tierClass(t) + '" style="flex:' + (c.byTier[t] / total) + '"></span>' : '';
    }).join('') + '</div>';
    h += '<div class="legend">' + [1, 2, 3, 4].map(function (t) {
      return '<span class="' + tierClass(t) + '"><i></i>' + c.byTier[t] + ' ' + Engine.TIERS[t].short.toLowerCase() + '</span>';
    }).join('') + '</div>';

    // What to watch out for
    h += '<section class="watch"><h3>' + ICON.alert + ' What to watch out for</h3>';
    if (report.watch.length) {
      h += '<p class="muted small">Flagged by chemical class, naming pattern or ingredient combination — not by an exact database match.</p><ul>' +
        report.watch.map(function (f) {
          return '<li class="' + tierClass(f.tier) + '"><i></i><div><strong>' + esc(f.status === 'inferred' ? f.name : f.found.join(', ')) + '</strong>' +
            '<span>' + esc(f.status === 'inferred' ? f.found[0] : f.label) + ' — ' + esc(f.why) + '</span></div></li>';
        }).join('') + '</ul>';
    } else {
      h += '<p class="muted small">Nothing flagged by chemical class — every flag below comes from an exact database match.</p>';
    }
    h += '</section>';

    // Flagged ingredients by tier
    [1, 2, 3].forEach(function (t) {
      const list = report.byTier[t];
      if (!list.length) return;
      h += '<section class="tier-section"><h3 class="' + tierClass(t) + '"><i></i>' + Engine.TIERS[t].label + ' <span class="count">' + list.length + '</span></h3>' +
        list.map(flagCard).join('') + '</section>';
    });
    if (!report.flagged.length && report.nodes.length) {
      h += '<section class="tier-section"><h3 class="t4"><i></i>No flagged ingredients</h3><p class="muted small">Nothing in this list matched tiers 1–3.</p></section>';
    }

    if (report.review.length) {
      h += '<section class="review"><h3>Not in database <span class="count">' + report.review.length + '</span></h3>' +
        '<p class="muted small">Assumed clean (they don\'t look like a harmful chemical class), but worth a manual check:</p>' +
        '<p>' + report.review.map(esc).join(', ') + '</p></section>';
    }

    h += '<section class="all"><h3>Full ingredient list</h3><p class="muted small">Tap an ingredient for details.</p>' +
      '<div class="chips">' + chipsHtml(report) + '</div><div id="chipInfo"></div></section>';

    if (rec.url) h += '<p class="small"><a href="' + esc(rec.url) + '" target="_blank" rel="noopener">View or correct this product on ' + esc(rec.source) + ' ↗</a></p>';
    h += '<p class="disclaimer">Tiers reflect a precautionary ruleset, not a medical or regulatory assessment. Concentration matters, and ingredient data from open databases can be incomplete.</p>';

    openSheet({
      view: 'result', title: 'Results', full: true, body: h,
      footer: '<button class="btn ghost" data-action="edit">Edit ingredients</button><button class="btn" data-action="close">Scan again</button>'
    });
  }

  function renderPaste(opts) {
    const rec = opts.record || {};
    const reasons = {
      notFound: ['Product not found', 'Barcode ' + (rec.code || '') + ' isn\'t in Open Food Facts or Open Beauty Facts yet. Paste the ingredient list from the label to analyze it.'],
      noIngredients: ['No ingredient list', 'Found “' + (rec.name || 'this product') + '” but it has no ingredient list yet. Paste it from the label to analyze it.'],
      offline: ['Couldn\'t reach the product databases', 'Check your connection and try again — or paste the ingredient list to analyze it offline.'],
      manual: null,
      edit: null
    };
    const r = reasons[opts.reason];
    const ctx = rec.context || '';
    let h = '';
    if (r) h += '<div class="notice"><div class="notice-icon">' + ICON.alert + '</div><div><h3>' + esc(r[0]) + '</h3><p>' + esc(r[1]) + '</p></div></div>';
    h += '<form class="form" data-form="paste">' +
      '<label>Product name <span class="muted">(optional)</span><input name="name" type="text" autocomplete="off" value="' + esc(rec.name || '') + '" placeholder="e.g. Daily moisturizer"></label>' +
      '<label>Product type<select name="context">' +
      '<option value=""' + (!ctx ? ' selected' : '') + '>Not sure</option>' +
      '<option value="food"' + (ctx === 'food' ? ' selected' : '') + '>Food / drink</option>' +
      '<option value="beauty"' + (ctx === 'beauty' ? ' selected' : '') + '>Personal care / cosmetic</option></select></label>' +
      '<label>Ingredients<textarea name="ingredients" rows="7" placeholder="Water, Glycerin, Sodium Laureth Sulfate, …" required>' + esc(opts.text || '') + '</textarea></label>' +
      '<p class="muted small">Tip: use Live Text (iPhone) or Google Lens (Android) on a photo of the label to copy the ingredient text.</p>' +
      '<button class="btn block" type="submit">Analyze ingredients</button></form>';
    if (opts.reason === 'notFound' && rec.code) {
      h += '<p class="small center"><a href="https://world.openfoodfacts.org/cgi/product.pl?type=search_or_add&code=' + encodeURIComponent(rec.code) + '" target="_blank" rel="noopener">Add this product to Open Food Facts ↗</a></p>';
    }
    state.pasteBase = rec;
    const footer = opts.reason === 'offline' && rec.code
      ? '<button class="btn ghost" data-action="retry" data-code="' + esc(rec.code) + '">Retry</button><button class="btn" data-action="close">Scan again</button>'
      : '<button class="btn ghost" data-action="close">' + (opts.reason === 'manual' ? 'Cancel' : 'Scan again') + '</button>';
    openSheet({ view: 'paste', title: opts.reason === 'edit' ? 'Edit ingredients' : 'Analyze ingredients', full: true, body: h, footer: footer });
  }

  function renderManual() {
    openSheet({
      view: 'manual', title: 'Enter barcode',
      body: '<form class="form" data-form="barcode">' +
        '<label>Barcode number<input name="code" type="text" inputmode="numeric" pattern="[0-9 ]*" autocomplete="off" maxlength="18" placeholder="e.g. 3017624010701" required></label>' +
        '<p class="muted small">The digits printed under the barcode (EAN-13, UPC-A, UPC-E or EAN-8).</p>' +
        '<button class="btn block" type="submit">Look up product</button></form>',
      footer: '<button class="btn ghost" data-action="close">Cancel</button>'
    });
    const input = $('input[name="code"]', els.sheetBody);
    input.focus();
  }

  function renderHistory() {
    const list = loadHistory();
    let h;
    if (!list.length) {
      h = '<div class="empty"><p>No scans yet.</p><p class="muted small">Your last ' + HISTORY_MAX + ' products are saved on this device.</p></div>';
    } else {
      h = '<ul class="history">' + list.map(function (rec, i) {
        const rep = Engine.analyzeProduct(rec.ingredientsText, { context: rec.context });
        const t = rep.verdict === 'UNKNOWN' ? 'tnone' : tierClass(rep.worst);
        const when = new Date(rec.scannedAt || Date.now()).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        return '<li><button data-action="open-history" data-i="' + i + '">' +
          '<span class="thumb sm">' + (rec.image ? '<img src="' + esc(rec.image) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : '') + ICON.box + '</span>' +
          '<span class="h-text"><strong>' + esc(rec.name || 'Unnamed product') + '</strong><span class="muted small">' + esc([rec.brand, when].filter(Boolean).join(' · ')) + '</span></span>' +
          '<span class="mini-verdict ' + t + '">' + rep.verdict + '</span>' + ICON.chevron + '</button></li>';
      }).join('') + '</ul>';
    }
    openSheet({
      view: 'history', title: 'Recent scans', full: list.length > 3, body: h,
      footer: (list.length ? '<button class="btn ghost" data-action="clear-history">Clear history</button>' : '') + '<button class="btn" data-action="close">Done</button>'
    });
  }

  /* ---------- ingredient search ---------- */
  function renderSearch(initial) {
    openSheet({
      view: 'search', title: 'Ingredient lookup', full: true,
      body: '<div class="searchbox">' + ICON.search + '<input id="q" type="search" placeholder="Type an ingredient, e.g. phenoxyethanol" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Ingredient name"></div><div id="searchOut"></div>',
      footer: '<button class="btn" data-action="close">Done</button>'
    });
    const q = $('#q');
    q.value = initial || '';
    q.addEventListener('input', function () { renderSearchResults(q.value); });
    q.addEventListener('keydown', function (e) { if (e.key === 'Enter') q.blur(); });
    renderSearchResults(q.value);
    q.focus();
  }

  function renderSearchResults(v) {
    const out = $('#searchOut');
    if (!out) return;
    const query = v.trim();
    if (!query) {
      const by = Engine.entriesByTier();
      out.innerHTML = '<p class="muted small">Or browse the database (' + Engine.stats.entries + ' flagged ingredients, ' + Engine.stats.names + ' names and synonyms, ' + Engine.stats.rules + ' class rules):</p>' +
        [1, 2, 3].map(function (t) {
          return '<details class="browse ' + tierClass(t) + '"><summary><i></i>' + Engine.TIERS[t].label + ' <span class="count">' + by[t].length + '</span></summary><div class="chips">' +
            by[t].map(function (e) { return '<button class="chip ' + tierClass(t) + '" data-action="search-entry" data-name="' + esc(e.name) + '">' + esc(e.name) + '</button>'; }).join('') +
            '</div></details>';
        }).join('');
      return;
    }
    let h = '';
    if (/[,;]/.test(query) && query.split(/[,;]/).filter(function (s) { return s.trim(); }).length > 1) {
      h += '<button class="btn block ghost" data-action="analyze-list">Analyze as a full ingredient list</button>';
    }
    h += infoCardHtml(query, Engine.analyzeName(query, null));
    const matches = Engine.search(query, 20);
    if (matches.length) {
      h += '<p class="label">Database matches</p><ul class="results">' + matches.map(function (e) {
        const also = e.names.slice(1, 5).join(', ');
        return '<li><button data-action="search-entry" data-name="' + esc(e.name) + '"><span><strong>' + esc(e.name) + '</strong>' +
          '<span class="muted small">' + esc(e.label) + (also ? ' · also: ' + esc(also) : '') + '</span></span>' + pill(e.tier) + '</button></li>';
      }).join('') + '</ul>';
    }
    out.innerHTML = h;
  }

  /* ---------------------------------------------------------------- events */
  document.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const a = btn.dataset.action;
    switch (a) {
      case 'close': closeSheet(); break;
      case 'manual': renderManual(); break;
      case 'paste': renderPaste({ reason: 'manual', record: {} }); break;
      case 'history': renderHistory(); break;
      case 'search': renderSearch(''); break;
      case 'torch': Scanner.toggleTorch(); break;
      case 'retry-camera': Scanner.blocked = false; Scanner.start(); break;
      case 'retry': lookupBarcode(btn.dataset.code, null); break;
      case 'edit':
        if (state.record) renderPaste({ reason: 'edit', record: state.record, text: state.record.ingredientsText });
        break;
      case 'open-history': {
        const rec = loadHistory()[+btn.dataset.i];
        if (rec) renderResult(rec);
        break;
      }
      case 'clear-history': clearHistory(); renderHistory(); toast('History cleared'); break;
      case 'chip': {
        const n = state.report && state.report.nodes[+btn.dataset.i];
        const box = $('#chipInfo');
        if (!n || !box) break;
        els.sheetBody.querySelectorAll('.chip.sel').forEach(function (c) { c.classList.remove('sel'); });
        btn.classList.add('sel');
        box.innerHTML = infoCardHtml(n.display, n.result);
        box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        break;
      }
      case 'search-entry': {
        const q = $('#q');
        if (q) { q.value = btn.dataset.name; renderSearchResults(q.value); els.sheetBody.scrollTop = 0; }
        break;
      }
      case 'analyze-list': {
        const q = $('#q');
        if (q) renderPaste({ reason: 'manual', record: {}, text: q.value });
        break;
      }
      case 'install':
        if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; els.install.hidden = true; }
        break;
    }
  });

  document.addEventListener('submit', function (e) {
    const form = e.target;
    const kind = form.dataset.form;
    if (!kind) return;
    e.preventDefault();
    if (kind === 'barcode') {
      const code = form.code.value.replace(/\D/g, '');
      if (code.length < 6 || code.length > 14) { toast('Enter 8–14 digits'); return; }
      if (!gtinValid(code) && !(code.length === 8)) toast('Check digit looks off — trying anyway');
      lookupBarcode(code, code.length === 8 ? null : 'MANUAL');
    } else if (kind === 'paste') {
      const text = form.ingredients.value.trim();
      if (!text) { toast('Paste an ingredient list first'); return; }
      const base = state.pasteBase || {};
      const rec = {
        code: base.code || '', name: form.name.value.trim() || base.name || 'Manual entry', brand: base.brand || '',
        image: base.image || '', source: base.source ? base.source.replace(/ \+ manual$/, '') + ' + manual' : 'Manual entry',
        context: form.context.value || null, url: base.url || '', ingredientsText: text, scannedAt: Date.now()
      };
      if (document.activeElement) document.activeElement.blur();
      saveHistory(rec);
      renderResult(rec);
    }
  });

  els.backdrop.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.sheetOpen) closeSheet(); });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) Scanner.stop();
    else if (!Scanner.blocked) Scanner.start();
  });

  /* ---------------------------------------------------------------- PWA */
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredInstall = e;
    els.install.hidden = false;
  });
  window.addEventListener('appinstalled', function () { els.install.hidden = true; });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (err) { console.warn('SW registration failed', err); });
    });
  }

  /* ---------------------------------------------------------------- boot */
  setHint('Loading scanner…');
  Scanner.start();
  const params = new URLSearchParams(location.search);
  if (params.get('view') === 'search') renderSearch(params.get('q') || '');
  else if (params.get('view') === 'history') renderHistory();
  else if (params.get('view') === 'paste') renderPaste({ reason: 'manual', record: {} });

  // Exposed for debugging / testing only.
  window.App = { Scanner: Scanner, handleScan: handleScan, renderResult: renderResult, zxingReady: zxingReady, upcEtoA: upcEtoA, barcodeCandidates: barcodeCandidates };
})();
</script>
</body>
</html>
